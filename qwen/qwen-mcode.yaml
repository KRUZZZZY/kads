# generated by qwenfix.py from http://127.0.0.1:8081/health - edits are overwritten
agents:
  default:
    modelConfigId: custom_provider:strata/qwen3.8-flash-next-coder
    skills: []        # drops the user's own skills from the catalog (~600 tokens); built-in ones stay
defaultModelContextWindow: 131072
permissionMode: bypassPermissions
logLevel: info
custom_provider:
  strata:
    name: strata
    kind: custom
    api: openai-completions
    enabled: true
    options:
      baseURL: http://127.0.0.1:8092/v1
      apiKey: local
      authMode: api-key
    models:
      qwen3.8-flash-next-coder:
        attachment: false
        limit: {context: 131072, output: 24576}
        modalities: {input: [text], output: [text]}
        reasoning: true
        thinking: {defaultEffort: high, effortOptions: [none, low, medium, high]}   # Strata's reasoning_effort values
        thinking_config: {default_value: "true", mode: switchable}
        tool_call: true
